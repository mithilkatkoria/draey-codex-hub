[package]
name = "draey-codex-hub"
version = "0.1.0-alpha.4"
description = "Multiple Codex accounts in your existing workspace"
authors = ["Draey"]
edition = "2021"

[lib]
name = "draey_hub"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tempfile = "3"
sysinfo = "0.37"
rfd = "0.15"
open = "5"
sha2 = "0.10"
base64 = "0.22"
toml = "0.8"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_Packaging_Appx"] }
